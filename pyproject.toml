[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythron"
version = "0.1.0"
description = "MYTHRON authorized security assessment AI prototype"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "playwright",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
